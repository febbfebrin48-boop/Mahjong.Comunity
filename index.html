<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jincai Mahjong Community</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #7d1616 0%, #4a0505 45%, #260000 100%);
  text-align: center;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
  padding: 45px 25px 55px;
}

.logo-circle {
  width: 150px;
  height: 150px;
  margin: 10px auto 30px;
  border: 3px solid #d4af37;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
}

.mahjong-tile {
  width: 90px;
  height: 110px;
  background: linear-gradient(135deg, #ffffff, #e7dfc8);
  border: 4px solid #d4af37;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #168a45;
  font-size: 64px;
  font-weight: bold;
}

h1 {
  color: #f5d36a;
  font-size: 42px;
  letter-spacing: 4px;
  margin-bottom: 10px;
}

.community {
  font-size: 23px;
  letter-spacing: 8px;
  color: #f5f1e6;
  margin-bottom: 18px;
}

.jincai {
  color: #d4af37;
  font-size: 16px;
  letter-spacing: 6px;
  margin-bottom: 45px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.link-button {
  min-height: 100px;
  padding: 18px 20px;
  border: 2px solid #d4af37;
  border-radius: 50px;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #8c0909, #550000);
  color: #f5d36a;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
}

.button-content {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.button-title {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 1px;
}

.button-subtitle {
  font-size: 13px;
  color: #f0dfaa;
}

.footer {
  margin-top: 50px;
  padding-top: 25px;
  border-top: 1px solid rgba(212, 175, 55, 0.45);
  color: #d4af37;
  letter-spacing: 4px;
  font-size: 13px;
}

.footer p {
  margin-top: 15px;
  color: #f0dfaa;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo-circle">
    <div class="mahjong-tile">發</div>
  </div>

  <h1>MAHJONG</h1>

  <div class="community">COMMUNITY</div>

  <div class="jincai">JINCAI MAHJONG</div>

  <div class="links">

    <a href="https://wa.me/6285922217655" class="link-button">
      <div class="button-content">
        <div class="button-title">💬 WHATSAPP ADMIN</div>
        <div class="button-subtitle">
          Hubungi admin untuk informasi
        </div>
      </div>
    </a>

    <a href="https://chat.whatsapp.com/Celvq8qXkJh5u85OnmGhmX" class="link-button">
      <div class="button-content">
        <div class="button-title">👥 GABUNG KOMUNITAS</div>
        <div class="button-subtitle">
          Join grup komunitas WhatsApp
        </div>
      </div>
    </a>

  </div>

  <div class="footer">
    JINCAI MAHJONG
    <p>SALAM MAHJONG</p>
  </div>

</div>

</body>
</html>
