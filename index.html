<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jincai Mahjong Community</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  color: white;
  background:
    radial-gradient(circle at 50% 0%, #8d1515 0%, #500606 38%, #240000 75%, #120000 100%);
}

/* BACKGROUND */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
}

.glow {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: rgba(212, 175, 55, 0.07);
  filter: blur(90px);
  left: 50%;
  top: 5%;
  transform: translateX(-50%);
}

.wave {
  position: absolute;
  width: 120%;
  height: 140px;
  bottom: -70px;
  left: -10%;
  border-radius: 50%;
  border-top: 2px solid rgba(255, 70, 50, 0.25);
  box-shadow:
    0 -10px 40px rgba(170, 20, 20, 0.3),
    0 -25px 70px rgba(120, 0, 0, 0.35);
  transform: rotate(-3deg);
}

/* FLOATING MAHJONG */

.tile {
  position: absolute;
  width: 75px;
  height: 95px;
  background: linear-gradient(135deg, #fffdf4, #e3d8bd);
  border: 2px solid #d4af37;
  border-radius: 12px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  opacity: 0.28;
  color: #8b1111;
}

.tile1 {
  top: -25px;
  left: -30px;
  transform: rotate(-28deg);
}

.tile2 {
  top: 20px;
  right: -35px;
  transform: rotate(25deg);
  color: #222;
}

.tile3 {
  top: 48%;
  left: -40px;
  transform: rotate(-25deg);
  color: #168a45;
}

.tile4 {
  bottom: 40px;
  right: -35px;
  transform: rotate(25deg);
}

.tile5 {
  bottom: -25px;
  left: -25px;
  transform: rotate(-30deg);
  color: #222;
}

/* MAIN */

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  padding: 30px 20px 50px;
  text-align: center;
}

/* LOGO */

.logo-area {
  position: relative;
  width: 185px;
  height: 185px;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gold-ring {
  position: absolute;
  width: 165px;
  height: 165px;
  border-radius: 50%;
  border: 2px solid #d4af37;
  box-shadow:
    0 0 16px rgba(212,175,55,0.55),
    inset 0 0 20px rgba(212,175,55,0.15);
}

.gold-ring::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  border: 1px solid rgba(212,175,55,0.4);
}

.cloud {
  position: absolute;
  color: #d4af37;
  font-size: 30px;
  opacity: 0.8;
}

.cloud-left {
  left: 0;
  top: 78px;
}

.cloud-right {
  right: 0;
  top: 78px;
}

.main-tile {
  width: 100px;
  height: 125px;
  border-radius: 18px;
  border: 3px solid #d4af37;
  background: linear-gradient(135deg, #ffffff, #f4ecd8 55%, #d6c39a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 68px;
  font-weight: bold;
  color: #168a45;
  box-shadow:
    0 10px 22px rgba(0,0,0,0.5),
    inset 0 0 15px rgba(255,255,255,0.9),
    0 0 20px rgba(212,175,55,0.35);
}

/* TITLE */

h1 {
  font-size: clamp(42px, 11vw, 58px);
  line-height: 0.95;
  letter-spacing: 2px;
  color: #f5d36a;
  text-shadow:
    0 3px 1px #7d4d00,
    0 6px 12px rgba(0,0,0,0.45);
}

.community {
  margin-top: 10px;
  font-family: Georgia, serif;
  font-size: clamp(20px, 6vw, 29px);
  letter-spacing: 8px;
  color: #f8f0dd;
  padding-left: 8px;
}

.jincai {
  margin: 22px auto 30px;
  color: #f5d36a;
  font-family: Georgia, serif;
  font-size: clamp(19px, 5vw, 26px);
  font-weight: bold;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.jincai::before,
.jincai::after {
  content: "";
  width: 35px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #d4af37);
}

.jincai::after {
  background: linear-gradient(90deg, #d4af37, transparent);
}

/* BUTTONS */

.links {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.link-button {
  width: 100%;
  min-height: 92px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  text-decoration: none;
  border-radius: 50px;
  border: 2px solid #d4af37;
  background: linear-gradient(135deg, #8c0909, #530000 60%, #350000);
  box-shadow:
    0 8px 22px rgba(0,0,0,0.4),
    inset 0 0 15px rgba(255,255,255,0.04),
    0 0 10px rgba(212,175,55,0.15);
}

.link-button:active {
  transform: scale(0.98);
}

.icon {
  width: 52px;
  min-width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  color: #f5d36a;
}

.button-text {
  flex: 1;
  text-align: left;
  padding-left: 8px;
}

.button-title {
  color: #f5d36a;
  font-size: clamp(16px, 4.5vw, 21px);
  font-weight: bold;
  letter-spacing: 0.5px;
  margin-bottom: 5px;
}

.button-subtitle {
  color: #f5f1e6;
  font-size: clamp(12px, 3.5vw, 15px);
  line-height: 1.3;
}

.arrow {
  font-size: 38px;
  color: #f5d36a;
  margin-left: 5px;
}

/* HP KECIL */

@media (max-width: 360px) {
  .container {
    padding: 25px 14px 40px;
  }

  .logo-area {
    width: 165px;
    height: 165px;
  }

  .gold-ring {
    width: 145px;
    height: 145px;
  }

  .main-tile {
    width: 88px;
    height: 110px;
    font-size: 60px;
  }

  .link-button {
    min-height: 85px;
  }
}

</style>
</head>

<body>

<div class="background">
  <div class="glow"></div>
  <div class="wave"></div>

  <div class="tile tile1">中</div>
  <div class="tile tile2">●</div>
  <div class="tile tile3">索</div>
  <div class="tile tile4">發</div>
  <div class="tile tile5">●</div>
</div>

<div class="container">

  <div class="logo-area">
    <div class="gold-ring"></div>

    <div class="cloud cloud-left">☁</div>
    <div class="cloud cloud-right">☁</div>

    <div class="main-tile">發</div>
  </div>

  <h1>MAHJONG</h1>

  <div class="community">COMMUNITY</div>

  <div class="jincai">JINCAI MAHJONG</div>

  <div class="links">

    <a href="https://api.whatsapp.com/send?phone=6285922217655" class="link-button">

      <div class="icon">☎</div>

      <div class="button-text">
        <div class="button-title">WHATSAPP ADMIN</div>
        <div class="button-subtitle">Reservation &amp; Booking</div>
      </div>

      <div class="arrow">›</div>

    </a>

    <a href="https://chat.whatsapp.com/Celvq8qXkJh5u85OnmGhmX" class="link-button">

      <div class="icon">👥</div>

      <div class="button-text">
        <div class="button-title">JOIN THE GROUP</div>
        <div class="button-subtitle">To get information about Event</div>
      </div>

      <div class="arrow">›</div>

    </a>

  </div>

</div>

</body>
</html>
