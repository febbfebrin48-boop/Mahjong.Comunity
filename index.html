<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jincai Mahjong Community</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  color: white;
  background:
    radial-gradient(circle at 50% 5%, #a51515 0%, #5b0707 35%, #240000 75%, #120000 100%);
}

/* BACKGROUND */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
}

.glow {
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: rgba(212, 175, 55, 0.08);
  filter: blur(100px);
  left: 50%;
  top: 10%;
  transform: translateX(-50%);
}

.wave {
  position: absolute;
  width: 120%;
  height: 180px;
  bottom: -80px;
  left: -10%;
  border-radius: 50%;
  border-top: 2px solid rgba(255, 70, 50, 0.3);
  box-shadow:
    0 -10px 40px rgba(170, 20, 20, 0.35),
    0 -25px 80px rgba(120, 0, 0, 0.4);
  transform: rotate(-3deg);
}

/* FLOATING MAHJONG */

.tile {
  position: absolute;
  width: 115px;
  height: 145px;
  background:
    linear-gradient(135deg, #fffdf4, #e3d8bd);
  border: 3px solid #d4af37;
  border-radius: 16px;
  box-shadow:
    0 15px 35px rgba(0,0,0,0.55),
    inset 0 0 12px rgba(255,255,255,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  opacity: 0.55;
  color: #8b1111;
}

.tile1 {
  top: -45px;
  left: -45px;
  transform: rotate(-28deg);
}

.tile2 {
  top: 15px;
  right: -55px;
  transform: rotate(25deg);
  font-size: 48px;
  color: #222;
}

.tile3 {
  top: 44%;
  left: -65px;
  transform: rotate(-25deg);
  font-size: 48px;
  color: #168a45;
}

.tile4 {
  bottom: 60px;
  right: -45px;
  transform: rotate(25deg);
}

.tile5 {
  bottom: -45px;
  left: -35px;
  transform: rotate(-30deg);
  font-size: 45px;
  color: #222;
}

/* MAIN */

.container {
  width: 100%;
  max-width: 560px;
  margin: auto;
  padding: 55px 22px 70px;
  text-align: center;
}

/* LOGO AREA */

.logo-area {
  position: relative;
  width: 250px;
  height: 250px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gold-ring {
  position: absolute;
  width: 225px;
  height: 225px;
  border-radius: 50%;
  border: 3px solid #d4af37;
  box-shadow:
    0 0 20px rgba(212,175,55,0.7),
    inset 0 0 25px rgba(212,175,55,0.2);
}

.gold-ring::before {
  content: "";
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  border: 1px solid rgba(212,175,55,0.5);
}

/* CLOUD */

.cloud {
  position: absolute;
  color: #d4af37;
  font-size: 45px;
  text-shadow: 0 0 15px rgba(212,175,55,0.5);
}

.cloud-left {
  left: -10px;
  top: 100px;
}

.cloud-right {
  right: -10px;
  top: 100px;
}

/* CENTER TILE */

.main-tile {
  position: relative;
  width: 135px;
  height: 165px;
  border-radius: 24px;
  border: 4px solid #d4af37;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f4ecd8 55%,
      #d6c39a
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 92px;
  font-weight: bold;
  color: #168a45;

  box-shadow:
    0 15px 30px rgba(0,0,0,0.55),
    inset 0 0 20px rgba(255,255,255,0.9),
    0 0 25px rgba(212,175,55,0.45);
}

/* TITLE */

h1 {
  font-size: clamp(52px, 14vw, 82px);
  line-height: 0.9;
  letter-spacing: 2px;

  color: #f5d36a;

  text-shadow:
    0 4px 1px #7d4d00,
    0 8px 15px rgba(0,0,0,0.5);

  margin-top: 10px;
}

.community {
  margin-top: 16px;

  font-family: Georgia, serif;

  font-size: clamp(24px, 7vw, 36px);

  letter-spacing: 11px;

  color: #f8f0dd;

  padding-left: 10px;
}

.jincai {
  margin: 28px auto 45px;

  color: #f5d36a;

  font-family: Georgia, serif;

  font-size: clamp(23px, 6vw, 32px);

  font-weight: bold;

  letter-spacing: 3px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.jincai::before,
.jincai::after {
  content: "";
  width: 55px;
  height: 2px;
  background:
    linear-gradient(
      90deg,
      transparent,
      #d4af37
    );
}

.jincai::after {
  background:
    linear-gradient(
      90deg,
      #d4af37,
      transparent
    );
}

/* BUTTONS */

.links {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.link-button {
  position: relative;

  width: 100%;
  min-height: 130px;

  padding: 20px 25px;

  display: flex;
  align-items: center;

  text-decoration: none;

  border-radius: 70px;

  border: 3px solid #d4af37;

  background:
    linear-gradient(
      135deg,
      #9d1010,
      #5c0000 60%,
      #380000
    );

  box-shadow:
    0 10px 30px rgba(0,0,0,0.45),
    inset 0 0 20px rgba(255,255,255,0.05),
    0 0 12px rgba(212,175,55,0.2);

  transition: 0.2s;
}

.link-button:active {
  transform: scale(0.98);
}

/* ICON */

.icon {
  width: 80px;
  min-width: 80px;
  height: 80px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 42px;

  color: #f5d36a;

  text-shadow:
    0 0 10px rgba(212,175,55,0.5);
}

/* TEXT */

.button-text {
  flex: 1;

  text-align: left;

  padding-left: 10px;
}

.button-title {
  color: #f5d36a;

  font-size: clamp(20px, 5vw, 28px);

  font-weight: bold;

  letter-spacing: 1px;

  margin-bottom: 8px;
}

.button-subtitle {
  color: #f5f1e6;

  font-size: clamp(14px, 4vw, 20px);

  line-height: 1.35;
}

/* ARROW */

.arrow {
  font-size: 60px;

  color: #f5d36a;

  font-weight: 200;

  margin-left: 10px;

  text-shadow:
    0 0 10px rgba(212,175,55,0.4);
}

/* RESPONSIVE */

@media (max-width: 380px) {

  .container {
    padding-left: 15px;
    padding-right: 15px;
  }

  .link-button {
    min-height: 115px;
    padding: 15px;
  }

  .icon {
    width: 65px;
    min-width: 65px;
    font-size: 34px;
  }

  .arrow {
    font-size: 45px;
  }

}

</style>
</head>


<body>

<div class="background">

  <div class="tile tile2">●</div>

</div>


</body>
</html>
